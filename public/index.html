<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-desk</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<aside id="sidebar">
  <div id="list-header">
    <h1>Sessions</h1>
    <span id="conn" class="conn" role="status" hidden>disconnected</span>
  </div>
  <button id="new-btn" type="button" aria-expanded="false" aria-controls="new-form">＋ New session</button>
  <button id="tl-btn" type="button" class="secondary">▶ Start team-lead</button>
  <form id="new-form" hidden autocomplete="off" aria-label="New session">
    <label>Name <input id="nf-name" required maxlength="80" spellcheck="false"></label>
    <label>Folder <input id="nf-cwd" required placeholder="~/Documents/dev/my-repo" spellcheck="false"></label>
    <div class="field">
      <label for="nf-agent">Agent (optional)</label>
      <div class="combo">
        <input id="nf-agent" placeholder="Search or type an agent">
        <button type="button" id="nf-agent-toggle" class="combo-toggle" tabindex="-1" aria-label="Show agents">▾</button>
        <ul id="nf-agent-list" class="combo-list" hidden></ul>
      </div>
    </div>
    <p id="nf-agent-desc" class="hint" hidden></p>
    <label>Model (optional) <input id="nf-model" list="nf-model-list" placeholder="Default model" spellcheck="false" maxlength="100"></label>
    <datalist id="nf-model-list">
      <option value="opus">
      <option value="sonnet">
      <option value="haiku">
      <option value="claude-fable-5-2">
      <option value="claude-opus-5-5">
      <option value="claude-sonnet-5-5">
      <option value="claude-haiku-5-5">
    </datalist>
    <p class="hint">Leave empty to use Claude Code's default model.</p>
    <label>First prompt <textarea id="nf-brief" rows="4"></textarea></label>
    <div class="row">
      <button type="submit" id="nf-submit">Start</button>
      <button type="button" id="nf-cancel" class="secondary">Cancel</button>
    </div>
    <p id="nf-error" class="form-error" role="alert" hidden></p>
  </form>
  <ul id="list" aria-label="Sessions"></ul>
</aside>
<main id="main">
  <header id="session-header" hidden></header>
  <div id="panes"></div>
  <div id="empty">Select a session, or start a new one.</div>
  <div id="toast" class="toast" role="alert" hidden></div>
</main>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
